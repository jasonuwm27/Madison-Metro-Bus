# PostgreSQL 17 tuning for the Madison Metro collector.
#
# Host: Oracle Ampere A1, 2 OCPU (aarch64), 12 GB RAM, 50 GB block volume.
# Crucially the box is SHARED: the collector worker, rclone, pg_dump and this
# database all live here. Sizing Postgres as if it owned the machine would
# starve the very process producing the data.
#
# Workload shape, measured rather than assumed:
#   - ~6,000 UPDATEs per poll, one poll every 30s, ~17M UPDATEs/day
#   - Writes are overwhelmingly HOT updates (no indexed column changes)
#   - Reads are rare and analytical (rollups), not user-facing
#   - 294 bytes/row, ~1.29 GB/month of observations
#
# So this is a WRITE-heavy, low-concurrency, small-working-set database.

# ---------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------

# 3GB of 12GB. The conventional 25% rule would give 3GB too, but the reasoning
# here is different: the hot working set is one week of partitions plus the
# indexes being updated, which is well under 3GB. Going higher would steal RAM
# from the page cache and from the worker without improving hit rates.
shared_buffers = 3GB

# What the planner assumes the OS will cache. Generous because after
# shared_buffers there is still ~8GB of RAM mostly acting as page cache.
effective_cache_size = 7GB

# Per-sort/hash memory. Deliberately modest: max_connections is low, but the
# rollup runs percentile_cont over a full service day (~170k rows) and a larger
# work_mem keeps that in memory instead of spilling to disk.
work_mem = 64MB

# Used by VACUUM, CREATE INDEX and autovacuum workers. Large enough that
# vacuuming a weekly partition is one pass.
maintenance_work_mem = 512MB

# ---------------------------------------------------------------------------
# Write path -- the part that matters for this workload
# ---------------------------------------------------------------------------

# 17M updates/day generates substantial WAL. Small max_wal_size forces frequent
# checkpoints, and a checkpoint storm on a 2-core box competes directly with
# the worker's 30-second poll deadline.
min_wal_size = 1GB
max_wal_size = 4GB

# Spread checkpoint I/O across 90% of the interval instead of dumping it.
# On a shared 2-core box a sharp checkpoint is felt by the collector.
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# Group commits within 200us. The worker issues one large upsert per poll, so
# this rarely triggers -- but when pg_dump and the worker overlap it helps.
commit_delay = 200
commit_siblings = 2

# Block storage here is network-attached SSD: seeks are cheap relative to
# spinning disk, so the planner should not over-penalise index scans.
random_page_cost = 1.1
effective_io_concurrency = 200

# ---------------------------------------------------------------------------
# Autovacuum -- tuned UP, deliberately
# ---------------------------------------------------------------------------
#
# This table takes 17M updates/day. Even though most are HOT (which reuses
# space in-page), HOT still produces dead tuples that must be reclaimed. The
# default autovacuum settings are calibrated for far gentler workloads and
# would fall behind, bloating the table and eventually the indexes.

autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 30s

# Vacuum when 2% of a partition is dead rather than the 20% default. Partitions
# are ~1M rows, so 20% would mean 200k dead tuples before any cleanup.
autovacuum_vacuum_scale_factor = 0.02
autovacuum_analyze_scale_factor = 0.01

# Do not throttle autovacuum into uselessness. The default cost limit makes it
# crawl on a write-heavy table; the collector's writes matter more than
# autovacuum's politeness, but a vacuum that never finishes is worse.
autovacuum_vacuum_cost_limit = 1000
autovacuum_vacuum_cost_delay = 2ms

# ---------------------------------------------------------------------------
# Connections
# ---------------------------------------------------------------------------
# Two workers (4 each) + maintenance scripts + psql headroom. Low
# max_connections is what makes the relatively large work_mem safe: worst case
# is max_connections * work_mem, and 25 * 64MB is comfortably bounded.
max_connections = 25

# ---------------------------------------------------------------------------
# Parallelism -- capped hard
# ---------------------------------------------------------------------------
# Only 2 cores, shared with the collector. Letting Postgres fan out a rollup
# query across both cores would stall the poll loop. One extra worker maximum.
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1

# ---------------------------------------------------------------------------
# Logging -- goes to journald alongside everything else
# ---------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 2000   # anything over 2s is worth knowing about
log_checkpoints = on
log_autovacuum_min_duration = 10000
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'

# ---------------------------------------------------------------------------
# Safety
# ---------------------------------------------------------------------------
# Full page writes on: the block volume can tear a page on power loss, and the
# archive can rebuild observations but not the static schema or rollups.
full_page_writes = on
fsync = on
synchronous_commit = on

# Listen only on loopback. Nothing outside this VM should reach Postgres, and
# the website plan serves static JSON rather than querying the database
# directly -- so there is never a reason to open this port.
listen_addresses = 'localhost'
