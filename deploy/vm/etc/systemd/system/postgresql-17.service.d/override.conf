[Unit]
RequiresMountsFor=/mnt/pgdata
After=mnt-pgdata.mount
BindsTo=mnt-pgdata.mount

[Service]
Environment=PGDATA=/mnt/pgdata/17/data
# The real guard. RequiresMountsFor can be satisfied by systemd auto-mounting,
# and the packaged unit will initdb an empty PGDATA -- so verify explicitly
# before the server is allowed to start. A non-zero exit here aborts the start.
ExecStartPre=/usr/local/bin/check-pgdata-volume.sh
