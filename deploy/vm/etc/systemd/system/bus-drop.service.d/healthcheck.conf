[Service]
SupplementaryGroups=bushc
# Report start/success/failure to healthchecks.io. Wrapping at the unit level
# means a job that dies before reaching application code still produces a
# missing ping -- and the absence of a ping is itself the alert.
ExecStart=
ExecStart=/usr/local/bin/healthcheck-wrap.sh DROP /usr/bin/node --import tsx/esm scripts/partitions.ts --drop --retain=10
