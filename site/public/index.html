<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0a0a0b">
<title>Is my bus late? — Madison Metro reliability</title>
<meta name="description" content="How often Madison Metro buses actually run late, by stop, route and time of day. Built from historical arrival data, not a live tracker.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚌</text></svg>">
<style>
/* ---------------------------------------------------------------------------
   Mobile-first. Every rule here is the phone rule; desktop is the media query
   at the bottom. The reader is standing outdoors at a bus stop, so: high
   contrast, large type, tap targets >=48px, and no layout that needs two hands.

   PALETTE: near-black, not navy -- navy reads as generic SaaS blue, near-black
   reads as deliberate. No accent hue: color is reserved entirely for the
   late/on-time/early status system, so when something IS colored here, it
   means something. Everything else (buttons, active tabs, the CTA) is
   neutral -- weight and contrast do the work instead of hue.
--------------------------------------------------------------------------- */
:root{
  --bg:#fafafa; --card:#fff; --ink:#0a0a0b; --muted:#6b6b70; --line:#e4e4e7;
  --raised:#f4f4f5;
  --accent:#18181b; --accent-ink:#fff;
  --late:#c2410c; --ontime:#15803d; --early:#6d28d9;
  --band:#e4e4e7; --band-ink:#18181b;
  --radius:10px;
  --pad:clamp(16px,4vw,28px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0a0a0b; --card:#111113; --ink:#ededf0; --muted:#8b8b92; --line:rgba(255,255,255,.09);
    --raised:#18181b;
    --accent:#ededf0; --accent-ink:#0a0a0b;
    --late:#fb923c; --ontime:#4ade80; --early:#c4b5fd;
    --band:#1c1c1f; --band-ink:#ededf0;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  overflow-wrap:break-word;
}
.wrap{max-width:720px;margin:0 auto;padding:0 var(--pad) 64px}
h1{font-size:clamp(23px,6vw,32px);line-height:1.15;margin:0 0 6px;letter-spacing:-.03em;font-weight:700}
h2{font-size:clamp(14px,3.5vw,15px);margin:0 0 10px;letter-spacing:-.005em;font-weight:600;
   color:var(--muted);text-transform:uppercase;font-size:12px;letter-spacing:.04em}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.tiny{font-size:12px}
.section{margin-top:40px}

/* ---- hero: answers "what is this / what do I do" in one screen -------- */
.hero{padding-top:28px}
.hero .lede{font-size:16px;color:var(--muted);margin:0 0 16px;max-width:46ch}

/* ---- disclaimer pill: near the top, not buried in the footer ----------
   "Not affiliated" is a legal/trust fact someone should see before they
   start trusting the numbers, not after they've scrolled past everything
   else -- a footer line nobody reads doesn't do its job. */
.disclaimer-pill{
  display:inline-block;margin:0 0 12px;padding:4px 10px;border-radius:999px;
  border:1px solid var(--line);background:var(--raised);
  font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.01em;
}

/* ---- trust-signal line: scale, start date, cadence -- not a raw counter
   Framed as "what backs this" (215K+ arrivals, collecting since <date>,
   updated nightly) rather than a bare "N arrivals recorded" sentence, and
   states the real once-nightly cadence explicitly so nobody mistakes this
   for a live tracker the way the bare title alone might suggest. */
.trust-line{
  font-size:12.5px;color:var(--muted);margin:0 0 16px;
  font-variant-numeric:tabular-nums;
}

/* ---- live pulse: the one live element on an otherwise static site ------
   A thin animated waveform, not a stat card -- the point is to read as "this
   is running right now" at a glance, not to be parsed. --i staggers each
   bar's animation-delay so the strip reads as a continuous wave. .stale (set
   when a fetch fails or the endpoint is unset) freezes the animation rather
   than hiding it -- a paused pulse still communicates state honestly. */
.pulse{margin:0 0 22px}
.pulse-wave{display:flex;align-items:center;gap:2px;height:20px;margin-bottom:6px}
.pbar{
  flex:1;min-width:2px;max-width:5px;height:35%;border-radius:2px;background:var(--ontime);
  opacity:.55;animation:pbar-wave 1.8s ease-in-out calc(var(--i) * 0.07s) infinite;
}
.pulse.stale .pbar{animation-play-state:paused;background:var(--muted);opacity:.3;height:20%!important}
@keyframes pbar-wave{
  0%,100%{height:20%}
  50%{height:90%}
}
.pulse-text{margin:0;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.pbar{animation:none;height:50%}}

/* ---- route tiles: routes as a real, prominent entry point -------------
   A grid of bare route numbers, not cards with copy -- someone who "takes
   the 80" recognises "80" instantly, and a dense grid fits far more routes
   above the fold than a list of rows ever could. */
.route-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px;
  margin-top:12px;margin-bottom:10px;
}
.route-tile{
  display:flex;align-items:center;justify-content:center;min-height:52px;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--card);
  color:inherit;text-decoration:none;font-weight:700;font-size:15px;
  font-variant-numeric:tabular-nums;
}
.route-tile:active{border-color:var(--ink)}

/* ---- recent stops: localStorage, no accounts -- learned, not configured */
.recent{margin-top:32px}

/* ---- omnisearch: the visual focal point of the landing screen ----------
   Combined route + stop search, directly under the subtitle. Sized and
   weighted well above every other control on the page (taller, larger
   type, a visible focus ring) so it reads as THE thing to do, not one
   option among equals. autofocus is set on both the real input and its
   SSR skeleton twin so focus lands correctly regardless of which one the
   browser sees first. */
.omnisearch{margin:18px 0 12px}
.omniq{
  width:100%;min-height:58px;padding:16px 18px;font-size:17px;font-weight:500;
  border:1.5px solid var(--line);border-radius:var(--radius);
  background:var(--card);color:var(--ink);
}
.omniq:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
.omniq::placeholder{color:var(--muted)}
#omniResults{margin-top:8px}
#omniResults:empty{margin-top:0}

/* ---- quick-select route pills, under the search box --------------------
   Tapping beats typing for someone who just wants "the 80" -- a handful of
   the busiest routes, one tap straight to the route page. */
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.pill-btn{
  display:inline-flex;align-items:center;min-height:36px;padding:8px 14px;
  border:1px solid var(--line);border-radius:999px;background:var(--card);
  color:inherit;text-decoration:none;font-weight:600;font-size:13.5px;
  font-variant-numeric:tabular-nums;
}
.pill-btn:active{border-color:var(--ink)}

/* ---- skeleton loading state: first paint before index.json arrives -----
   Shown only inside the SSR-baked hero (see export-site.ts renderHeroSsr);
   app.js replaces the whole block on load, so this never has to be torn
   down explicitly -- it just stops existing. */
.skel-pill{width:64px;background:var(--raised);border-color:var(--raised);
  animation:skel-pulse 1.4s ease-in-out infinite}
.skel-pill:nth-child(2){animation-delay:.1s}
.skel-pill:nth-child(3){animation-delay:.2s}
.skel-pill:nth-child(4){animation-delay:.3s}
.skel-pill:nth-child(5){animation-delay:.4s}
@keyframes skel-pulse{0%,100%{opacity:.5}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.skel-pill{animation:none;opacity:.7}}

.locate-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  min-height:60px;padding:14px 18px;border:0;border-radius:var(--radius);
  background:var(--accent);color:var(--accent-ink);
  font:600 16px/1.15 system-ui,sans-serif;cursor:pointer;
}
.locate-btn:active{opacity:.85}

/* ---- controls: big enough to hit while holding a bag ---- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  min-height:50px;padding:12px 18px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--card);color:var(--ink);
  font:600 15px/1 system-ui,sans-serif;cursor:pointer;
}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:active{opacity:.85}
.btn.link-btn{
  background:transparent;color:var(--ink);border:0;min-height:auto;
  padding:10px 0;font-weight:600;font-size:14px;width:auto;text-decoration:underline;
  text-underline-offset:3px;text-decoration-color:var(--line);
}
input[type=search]{
  width:100%;min-height:50px;padding:12px 15px;font-size:16px;
  border:1px solid var(--line);border-radius:var(--radius);
  background:var(--card);color:var(--ink);
}
input[type=search]:focus{outline:2px solid var(--ink);outline-offset:-1px}

/* ---- lists: stops and routes ---- */
.stops{list-style:none;margin:10px 0 0;padding:0}
.stops li{margin-bottom:6px}
.stop{
  display:block;width:100%;text-align:left;min-height:52px;
  padding:11px 14px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--card);color:inherit;cursor:pointer;text-decoration:none;
}
.stop:active{border-color:var(--ink)}
.stop .nm{font-weight:600;display:block;font-size:15px}
.stop .sub{display:block;margin-top:2px;font-size:12px;color:var(--muted)}
.pill{
  display:inline-block;padding:2px 7px;border-radius:999px;font-size:11px;
  font-weight:600;background:var(--band);color:var(--band-ink);margin-left:6px;
  vertical-align:1px;
}
.pill.wait{background:transparent;color:var(--muted);border:1px solid var(--line)}

/* ---- the result card ---- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin:0 0 12px;
}
.card h3{margin:0 0 2px;font-size:15.5px;font-weight:600;color:var(--muted)}

/* ---- error banner: a fetch genuinely failed, not just "no data" --------
   Visually distinct from .card (which is used for the softer "not enough
   data yet" empty states) -- a warm border says "something is actually
   wrong", not just "nothing to show". */
.error-banner{
  background:var(--card);border:1px solid var(--late);border-radius:var(--radius);
  padding:16px;margin:0 0 12px;
}
.error-banner p{margin:0 0 8px}
.error-banner p:last-child{margin-bottom:0}

/* ---- the headline sentence: the answer, before any chart or number ---- */
.headline{font-size:clamp(19px,5vw,23px);font-weight:700;line-height:1.3;margin:4px 0 4px;letter-spacing:-.01em}
.headline .hi.late{color:var(--late)} .headline .hi.ontime{color:var(--ontime)} .headline .hi.early{color:var(--early)}
.headline-sub{font-size:13px;color:var(--muted);margin:0 0 4px}

.metric{margin:14px 0 0}
.metric .lbl{font-size:12.5px;color:var(--muted);margin-bottom:5px}
.metric .val{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.metric .val.late{color:var(--late)} .metric .val.ontime{color:var(--ontime)} .metric .val.early{color:var(--early)}

/* ---- presets: the default way into a stop, grid is the escape hatch --- */
.presets{display:grid;grid-template-columns:1fr;gap:7px;margin-top:10px}
.preset{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  min-height:52px;padding:12px 15px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--card);color:inherit;font:inherit;cursor:pointer;text-align:left;
}
.preset[aria-selected=true]{border-color:var(--ink);background:var(--raised)}
.preset .pn{font-weight:600;font-size:14.5px}
.preset .pw{font-size:12px;color:var(--muted);margin-top:2px}
.preset .pv{font-weight:700;font-size:14.5px;white-space:nowrap}
.preset .pv.late{color:var(--late)} .preset .pv.ontime{color:var(--ontime)} .preset .pv.early{color:var(--early)}

/* ---- progressive disclosure: detail is one tap away, not the default -- */
details.more{margin-top:16px}
details.more>summary{
  cursor:pointer;list-style:none;font-size:13.5px;font-weight:600;color:var(--ink);
  padding:10px 0;user-select:none;
}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"▸ ";display:inline-block;transition:transform .15s;color:var(--muted)}
details.more[open]>summary::before{transform:rotate(90deg)}

/* ---- "what counts as late" definition -- same disclosure pattern, but
   lighter-weight styling (smaller, muted) since it's a glossary note, not
   a primary content toggle like the ones above. */
details.ontime-def{margin-top:14px}
details.ontime-def>summary{
  cursor:pointer;list-style:none;font-size:12.5px;font-weight:600;color:var(--muted);
  padding:6px 0;user-select:none;
}
details.ontime-def>summary::-webkit-details-marker{display:none}
details.ontime-def>summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
details.ontime-def[open]>summary::before{transform:rotate(90deg)}
details.ontime-def p{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5}

/* ---- Wilson interval as a RANGE BAR -----------------------------------
   A wide band must LOOK wide without reading any numbers. The track is the
   full 0-100% (or the delay domain); the filled band is the plausible range;
   the tick is the point estimate. At n=3 this is visibly most of the width.
------------------------------------------------------------------------ */
.range{margin-top:8px}
.track{
  position:relative;height:14px;border-radius:999px;background:var(--raised);
  border:1px solid var(--line);overflow:hidden;
}
.band{position:absolute;top:0;bottom:0;background:var(--band)}
.tick{position:absolute;top:-3px;bottom:-3px;width:3px;border-radius:2px;background:var(--band-ink)}
.scale{display:flex;justify-content:space-between;margin-top:4px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

.note{
  margin-top:12px;padding:11px 13px;border-radius:8px;
  background:var(--raised);border:1px solid var(--line);
  font-size:13px;color:var(--muted);
}
.scope{
  display:inline-block;margin-top:10px;padding:5px 10px;border-radius:6px;
  background:var(--band);color:var(--band-ink);font-size:12px;font-weight:600;
}
.counts{margin-top:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---- tabs (day type / hour) ---- */
.tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.tab{
  flex:0 0 auto;min-height:40px;padding:9px 14px;border:1px solid var(--line);
  border-radius:999px;background:var(--card);color:inherit;font-size:13.5px;cursor:pointer;
}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hours{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px;margin-top:10px}
.hr{
  min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--card);
  color:inherit;font-size:13px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
}
.hr[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hr .n{font-size:10px;opacity:.7}
.hr.none{opacity:.4}
details.grid-toggle{margin-top:18px}
details.grid-toggle>summary{
  cursor:pointer;list-style:none;font-size:13px;font-weight:600;color:var(--muted);
  padding:6px 0;user-select:none;
}
details.grid-toggle>summary::-webkit-details-marker{display:none}
details.grid-toggle>summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
details.grid-toggle[open]>summary::before{transform:rotate(90deg)}

/* ---- route page: overall figure, delay-profile chart, best/worst ---- */
.route-head{margin-bottom:18px}
.route-head .headline{margin-top:8px}
.dir-tabs{margin-bottom:6px}
.profile-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 calc(var(--pad) * -1);padding:0 var(--pad)}
.profile-svg{display:block;overflow:visible}
.profile-note{font-size:12px;color:var(--muted);margin-top:8px}

/* ---- profile chart dots: tap-to-select is primary, hover is a bonus ----
   The visible dot (.pdot) is small and precise; .pdot-hit is the REAL tap
   target, sized well past the dot itself so a finger doesn't need to land on
   a 3.5px circle. Selection state persists via .selected -- unlike a
   tooltip, it survives after the finger lifts, which is the whole point on
   touch. Hover-highlighting the dot under the pointer is desktop-only sugar
   layered on top via a plain CSS :hover, never required to see a value. */
.pdot{fill:var(--ink);stroke:var(--card);stroke-width:1.5px;transition:r .1s}
.pdot-g.selected .pdot{fill:var(--late);r:5}
.pdot-hit{
  width:100%;height:100%;border:0;background:transparent;border-radius:50%;
  cursor:pointer;padding:0;display:block;
}
@media (hover:hover){
  .pdot-g:hover .pdot{r:5}
}
.profile-detail{margin-top:10px}
.profile-card{border-color:var(--ink)}
.profile-card h3{margin-bottom:8px}
.rank-list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.rank-list li{
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  padding:10px 13px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;
}
.rank-list .rn{font-weight:600;display:block}
.rank-list .rn-sub{display:block;margin-top:2px;font-size:11.5px;color:var(--muted)}
.rank-list .rv{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;padding-top:1px}
.flag-badge{
  display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;
  background:var(--late);color:#fff;font-size:10.5px;font-weight:700;vertical-align:1px;
}
@media (prefers-color-scheme:dark){.flag-badge{color:#1a0800}}
.two-col{display:grid;grid-template-columns:1fr;gap:20px;margin-top:8px}

/* ---- system snapshot: quick value before anyone has searched -----------
   The worst-routes list reuses .rank-list/.rn/.rv but each row is itself
   the link (not a bare row), so .rank-list's own padding is zeroed here
   and pushed onto the link instead -- otherwise the tap target would be
   smaller than the visible row. */
.rank-list.snapshot-worst li{padding:0;overflow:hidden}
.snapshot-route-link{
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  width:100%;padding:10px 13px;color:inherit;text-decoration:none;
}
.snapshot-route-link:active{background:var(--raised)}

/* ---- dataset growth chart + the "nobody else keeps this" claim -------- */
.growth-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 16px;margin-top:14px;
}
.growth-claim{font-size:15px;font-weight:600;line-height:1.4;margin:0 0 4px}
.growth-sub{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.growth-svg{display:block;width:100%;height:auto}
.growth-caption{font-size:11.5px;color:var(--muted);margin-top:8px;text-align:right}

/* ---- data completeness: coverage per day, gaps explained not hidden ----
   Three states: gap-known (a diagnosed cause -- VM reboot, agency outage --
   shown as ordinary, not alarming, since it's understood and excluded from
   reliability figures already), gap-unexplained (low coverage with no
   diagnosis yet -- the one state that should read as "needs attention"),
   gap-none (normal day, no annotation needed). */
.coverage-list{display:flex;flex-direction:column;gap:2px;margin-top:12px}
.cov-row{
  display:grid;grid-template-columns:52px 1fr 40px;align-items:center;gap:10px;
  padding:8px 0;border-bottom:1px solid var(--line);
}
.cov-date{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cov-bar-track{height:8px;border-radius:999px;background:var(--raised);overflow:hidden}
.cov-bar-fill{height:100%;border-radius:999px;background:var(--ontime)}
.cov-pct{font-size:12.5px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.cov-row.gap-known .cov-bar-fill{background:var(--muted)}
.cov-row.gap-known .cov-pct{color:var(--muted)}
.cov-row.gap-unexplained .cov-bar-fill{background:var(--late)}
.cov-row.gap-unexplained .cov-pct{color:var(--late)}
.cov-reason{
  grid-column:1 / -1;margin:2px 0 0;font-size:12px;color:var(--muted);
  line-height:1.4;
}
.cov-row.gap-unexplained .cov-reason{color:var(--late)}

/* ---- dataset banner: demoted to a footnote of credibility ---- */
.banner{
  border-top:1px solid var(--line);padding-top:16px;margin-top:14px;
}
.stat-row{display:flex;flex-wrap:wrap;gap:18px 22px;margin-top:10px}
.stat b{display:block;font-size:19px;line-height:1.15;font-variant-numeric:tabular-nums;font-weight:700}
.stat span{font-size:11.5px;color:var(--muted)}

a{color:inherit;text-decoration-color:var(--line)}
footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.hidden{display:none!important}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (min-width:760px){
  .wrap{padding-top:8px}
  .two-col{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <main id="view">
    <!-- SSR-BEGIN -->
    <div class="hero">
      <span class="disclaimer-pill">Not affiliated with the City of Madison</span>
